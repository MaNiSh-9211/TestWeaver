<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TestWeaver - AI-Powered Automation Testing Platform</title>
    <meta name="description" content="TestWeaver revolutionizes web testing with intelligent AI agents that understand your Jira tickets and automatically generate comprehensive test automation scripts." />
    <meta name="keywords" content="automation testing, AI testing, Jira integration, web testing, Puppeteer, test automation, QA tools" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="TestWeaver - AI-Powered Automation Testing Platform" />
    <meta property="og:description" content="Transform your Jira tickets into comprehensive automated tests with AI-powered intelligence." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://testweaver.app" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TestWeaver - AI-Powered Automation Testing" />
    <meta name="twitter:description" content="Revolutionary automation testing with AI agents, Jira integration, and Puppeteer-powered execution." />
    <meta name="twitter:image" content="/twitter-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#00D9FF" />
    <meta name="msapplication-TileColor" content="#0A0A0A" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TestWeaver",
      "description": "AI-powered automation testing platform that transforms Jira tickets into comprehensive test scripts",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "TestWeaver"
      },
      "featureList": [
        "Jira Webhook Integration",
        "AI-Powered Test Generation",
        "Puppeteer Automation",
        "Real-time Test Execution",
        "Comprehensive Reporting",
        "Authentication Handling"
      ]
    }
    </script>
    
    <style>
      /* Critical CSS for loading state */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: #0A0A0A;
        color: #FFFFFF;
        overflow-x: hidden;
      }
      
      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0A0A0A;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        width: 50px;
        height: 50px;
        border: 3px solid transparent;
        border-top: 3px solid #00D9FF;
        border-right: 3px solid #7C3AED;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #00D9FF;
        font-weight: 600;
        font-size: 18px;
        text-align: center;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      /* Logo animation */
      .loading-logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(45deg, #00D9FF, #7C3AED);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      /* Hide root until loaded */
      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      
      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="loader"></div>
      <div class="loading-text">
        <div>Loading TestWeaver...</div>
        <div style="font-size: 14px; color: #7C3AED; margin-top: 8px;">AI-Powered Automation Testing</div>
      </div>
    </div>
    
    <!-- Main App -->
    <div id="root"></div>
    
    <!-- Scripts -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Loading Script -->
    <script>
      // Hide loading screen once the app loads
      window.addEventListener('load', function() {
        const loadingScreen = document.getElementById('loading-screen');
        const root = document.getElementById('root');
        
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          root.classList.add('loaded');
          
          // Remove loading screen from DOM after animation
          setTimeout(() => {
            loadingScreen.remove();
          }, 500);
        }, 1000); // Show loading for at least 1 second
      });
      
      // Fallback: hide loading screen after 5 seconds max
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        const root = document.getElementById('root');
        
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
          root.classList.add('loaded');
          setTimeout(() => {
            if (loadingScreen.parentNode) {
              loadingScreen.remove();
            }
          }, 500);
        }
      }, 5000);
      
      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', function() {
          const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
          console.log('TestWeaver loaded in', loadTime, 'ms');
        });
      }
    </script>
    
    <!-- Replit Development Banner -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
